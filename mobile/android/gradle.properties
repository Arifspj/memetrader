# Capped deliberately: the default 8G heap does not fit this machine's paging
# file, so the Gradle daemon dies with "Native memory allocation (mmap) failed".
org.gradle.jvmargs=-Xmx1536M -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=false
