services:
  postgres:
    image: postgres:16-alpine
    container_name: memetrader_pg
    environment:
      POSTGRES_USER: memetrader
      POSTGRES_PASSWORD: memetrader
      POSTGRES_DB: memetrader
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memetrader"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: memetrader_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
